
name: Governance Unit Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  governance-tests:
    name: Run Governance Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout governance repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install PyYAML==6.0.3

      - name: Run unit tests
        run: |
          python -m unittest discover \
            -s tests \
            -p "test_*.py" \
            -v
